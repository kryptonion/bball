<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bowling Match Stats</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* All original styles preserved exactly */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink:      #0a0a08;
      --paper:    #f5f0e8;
      --cream:    #ede7d4;
      --gold:     #b8933f;
      --gold-lt:  #d4aa5a;
      --rust:     #8b3a2a;
      --sage:     #4a5e4a;
      --warm-gray:#8a8278;
      --rule:     #c8bfa8;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Mono', monospace;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
      opacity: 0.4;
    }
    .reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.7s cubic-bezier(0.22,1,0.36,1), transform 0.7s cubic-bezier(0.22,1,0.36,1); }
    .reveal.in { opacity: 1; transform: translateY(0); }
    .stagger > * { opacity: 0; transform: translateY(20px); transition: opacity 0.55s cubic-bezier(0.22,1,0.36,1), transform 0.55s cubic-bezier(0.22,1,0.36,1); }
    .stagger.in > * { opacity: 1; transform: translateY(0); }
    .scale-in { opacity: 0; transform: scale(0.94) translateY(16px); transition: opacity 0.6s cubic-bezier(0.22,1,0.36,1), transform 0.6s cubic-bezier(0.22,1,0.36,1); }
    .scale-in.in { opacity: 1; transform: scale(1) translateY(0); }
    .masthead-eyebrow { opacity: 0; transform: translateY(-12px); animation: fadeSlideDown 0.6s cubic-bezier(0.22,1,0.36,1) 0.1s forwards; }
    .masthead h1 { overflow: hidden; }
    .masthead h1 .line1, .masthead h1 .line2 { display: block; opacity: 0; transform: translateY(110%); }
    .masthead h1 .line1 { animation: slideUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.25s forwards; }
    .masthead h1 .line2 { animation: slideUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.38s forwards; color: var(--gold); }
    .masthead-meta { opacity: 0; animation: fadeIn 0.6s ease 0.65s forwards; }
    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes fadeSlideDown { to { opacity: 1; transform: translateY(0); } }
    .masthead-bg-text { animation: floatBg 8s ease-in-out infinite; }
    @keyframes floatBg { 0%, 100% { transform: translateY(0px) rotate(-2deg); } 50% { transform: translateY(-18px) rotate(2deg); } }
    .t-score { opacity: 0; transform: scale(0.5); transition: opacity 0.5s cubic-bezier(0.22,1,0.36,1), transform 0.5s cubic-bezier(0.34,1.56,0.64,1); }
    .t-score.slam { opacity: 1; transform: scale(1); }
    .lb-bar { width: 0 !important; transition: width 1.2s cubic-bezier(0.22,1,0.36,1); }
    .lb-bar.animate { width: var(--target-w) !important; }
    .game-card { transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), box-shadow 0.35s cubic-bezier(0.22,1,0.36,1); }
    .game-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(10,10,8,0.14); }
    .hl-card { transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), box-shadow 0.35s cubic-bezier(0.22,1,0.36,1); }
    .hl-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 16px 40px rgba(10,10,8,0.12); }
    .lb-row { transition: background 0.25s ease, padding-left 0.3s cubic-bezier(0.22,1,0.36,1); border-radius: 2px; }
    .lb-row:hover { background: var(--cream); padding-left: 8px; }
    .game-row { transition: background 0.22s ease; }
    .game-row:not(.win):hover { background: #f9f5ed; }
    .lb-row.top .lb-total {
      position: relative;
      background: linear-gradient(90deg, var(--rust) 0%, var(--gold) 40%, var(--rust) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3.5s linear infinite 1.5s;
    }
    @keyframes shimmer { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
    .team-block.winner .t-tag { animation: pulseBadge 2.5s ease-in-out infinite 1.2s; }
    @keyframes pulseBadge { 0%, 100% { box-shadow: 0 0 0 0 rgba(184,147,63,0.5); } 50% { box-shadow: 0 0 0 8px rgba(184,147,63,0); } }
    .hl-card::before { width: 0; transition: width 0.8s cubic-bezier(0.22,1,0.36,1); }
    .hl-card.in::before { width: 100%; }
    hr.rule { border: none; border-top: 1px solid var(--rule); margin: 0 20px; opacity: 0; transition: opacity 0.6s ease; }
    hr.rule.in { opacity: 1; }
    .section-title::after { content: ''; height: 1px; background: var(--rule); width: 0; flex: unset; transition: width 0.9s cubic-bezier(0.22,1,0.36,1) 0.2s; }
    .section-title.in::after { width: 100%; flex: 1; }
    .game-rows .game-row { opacity: 0; transform: translateX(-12px); transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.22,1,0.36,1); }
    .game-card.in .game-rows .game-row { opacity: 1; transform: none; }
    .gr-fill { width: 0 !important; transition: width 0.8s cubic-bezier(0.22,1,0.36,1); }
    .game-card.in .gr-fill { width: var(--fill-w) !important; }
    .pip.filled { opacity: 0; transform: scale(0); transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34,1.56,0.64,1); }
    .lb-row.in .pip.filled { opacity:1; transform:scale(1); }
    .masthead { background: var(--ink); color: var(--paper); padding: 0 20px; position: relative; overflow: hidden; }
    .masthead-inner { max-width: 480px; margin: 0 auto; padding: 48px 0 36px; }
    .masthead-eyebrow { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .masthead-eyebrow::before, .masthead-eyebrow::after { content: ''; flex: 1; height: 1px; background: var(--gold); opacity: 0.4; }
    .masthead h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(68px, 18vw, 120px); line-height: 0.88; letter-spacing: -1px; color: var(--paper); }
    .masthead-meta { margin-top: 28px; display: grid; grid-template-columns: 1fr 1px 1fr 1px 1fr; gap: 0; border-top: 1px solid rgba(245,240,232,0.12); padding-top: 20px; }
    .meta-item { text-align: center; padding: 0 8px; }
    .meta-item .val { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold-lt); display: block; line-height: 1; }
    .meta-item .lbl { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--warm-gray); margin-top: 4px; display: block; }
    .meta-divider { background: rgba(245,240,232,0.1); align-self: center; height: 32px; }
    .masthead-bg-text { position: absolute; bottom: -20px; right: -10px; font-family: 'Bebas Neue', sans-serif; font-size: 160px; color: rgba(184,147,63,0.06); line-height: 1; pointer-events: none; letter-spacing: -4px; }
    section { max-width: 480px; margin: 0 auto; padding: 40px 20px; }
    .section-label { font-size: 9px; letter-spacing: 5px; text-transform: uppercase; color: var(--warm-gray); margin-bottom: 6px; }
    .section-title { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--ink); margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
    .h2h { background: var(--ink); color: var(--paper); }
    .h2h section { padding: 36px 20px; }
    .h2h .section-label { color: var(--gold); opacity: 0.7; }
    .h2h .section-title { color: var(--paper); }
    .h2h .section-title::after { background: rgba(245,240,232,0.12); }
    .vs-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; align-items: center; margin-top: 8px; }
    .team-block { text-align: center; padding: 20px 12px; }
    .team-block .t-name { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--warm-gray); margin-bottom: 10px; display: block; }
    .team-block .t-score { font-family: 'Bebas Neue', sans-serif; font-size: clamp(72px, 20vw, 110px); line-height: 1; color: var(--paper); }
    .team-block.winner .t-score { color: var(--gold-lt); }
    .team-block .t-tag { display: inline-block; margin-top: 8px; font-size: 8px; letter-spacing: 2px; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; background: rgba(245,240,232,0.06); color: var(--warm-gray); }
    .team-block.winner .t-tag { background: var(--gold); color: var(--ink); }
    .vs-sep { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .vs-sep::before, .vs-sep::after { content: ''; width: 1px; height: 40px; background: rgba(245,240,232,0.1); }
    .vs-badge { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--warm-gray); letter-spacing: 2px; }
    .lb-stack { display: flex; flex-direction: column; gap: 0; }
    .lb-row { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 0 16px; padding: 16px 0; border-bottom: 1px solid var(--rule); position: relative; }
    .lb-row:last-child { border-bottom: none; }
    .lb-rank { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--rule); text-align: center; line-height: 1; }
    .lb-row.top .lb-rank { color: var(--gold); }
    .lb-name { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--ink); line-height: 1; }
    .lb-row.top .lb-name { color: var(--rust); }
    .lb-sub { font-size: 10px; color: var(--warm-gray); margin-top: 4px; letter-spacing: 1px; }
    .lb-sub span { margin-right: 10px; }
    .lb-right { text-align: right; }
    .lb-total { font-family: 'Bebas Neue', sans-serif; font-size: 34px; line-height: 1; color: var(--ink); }
    .lb-avg { font-size: 10px; color: var(--warm-gray); letter-spacing: 1px; }
    .lb-bar-wrap { grid-column: 2 / 4; margin-top: 8px; height: 2px; background: var(--cream); border-radius: 4px; overflow: hidden; }
    .lb-bar { height: 100%; background: var(--rule); border-radius: 4px; }
    .lb-row.top .lb-bar { background: var(--gold); }
    .wins-pip-row { display: flex; gap: 4px; margin-top: 5px; }
    .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--rule); }
    .pip.filled { background: var(--gold); }
    .games-grid { display: flex; flex-direction: column; gap: 20px; }
    .game-card { border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; background: white; }
    .game-header { background: var(--ink); color: var(--paper); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
    .game-num { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; color: var(--gold); }
    .game-total { font-size: 10px; color: var(--warm-gray); letter-spacing: 2px; }
    .game-row { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--cream); gap: 12px; position: relative; }
    .game-row:last-child { border-bottom: none; }
    .game-row.win { background: #fdf9ee; }
    .game-row .gr-fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(184,147,63,0.06); }
    .gr-left { display: flex; align-items: center; gap: 10px; position: relative; }
    .gr-pos { font-size: 9px; color: var(--warm-gray); letter-spacing: 1px; width: 16px; text-align: center; }
    .game-row.win .gr-pos { color: var(--gold); }
    .gr-name { font-family: 'DM Serif Display', serif; font-size: 17px; color: var(--ink); }
    .game-row.win .gr-name { color: var(--rust); }
    .gr-score { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--ink); position: relative; }
    .game-row.win .gr-score { color: var(--gold); }
    .highlights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hl-card { border: 1px solid var(--rule); padding: 18px 16px; border-radius: 4px; background: white; position: relative; overflow: hidden; }
    .hl-card::before { content: ''; position: absolute; top: 0; left: 0; height: 3px; }
    .hl-card.gold::before  { background: var(--gold); }
    .hl-card.rust::before  { background: var(--rust); }
    .hl-card.sage::before  { background: var(--sage); }
    .hl-card:not(.gold):not(.rust):not(.sage)::before { background: var(--rule); }
    .hl-icon { font-size: 20px; margin-bottom: 8px; }
    .hl-label { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: var(--warm-gray); margin-bottom: 6px; }
    .hl-value { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--ink); line-height: 1.1; }
    .hl-value em { font-style: normal; font-family: 'Bebas Neue', sans-serif; font-size: 28px; display: block; color: var(--rust); }
    footer { background: var(--ink); color: var(--warm-gray); text-align: center; padding: 28px 20px; }
    footer .f-logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 6px; color: var(--gold); margin-bottom: 6px; }
    footer p { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; }

    /* REDESIGNED HIGH SCORE BUTTON & CONTAINER */
    .hs-btn-wrap { display: flex; justify-content: center; margin-bottom: 30px; }
    .btn-premium {
      font-family: 'DM Mono', monospace; 
      font-size: 10px; 
      font-weight: 500;
      letter-spacing: 3px; 
      text-transform: uppercase;
      background: rgba(10,10,8, 0.03); 
      color: var(--ink); 
      border: 2px solid var(--ink); /* Thicker border */
      padding: 16px 40px; 
      cursor: pointer; 
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      border-radius: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }
    .btn-premium::after { 
      content: '↓'; 
      font-size: 14px; 
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1); 
    }
    .btn-premium.active {
      background: var(--ink);
      color: var(--gold);
    }
    .btn-premium.active::after { 
      transform: rotate(180deg); 
    }
    .btn-premium:hover:not(.active) { 
      background: var(--ink); 
      color: var(--paper);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(10,10,8,0.15);
    }

    .hs-container { 
      max-height: 0; 
      overflow: hidden; 
      transition: max-height 0.9s cubic-bezier(0.22, 1, 0.36, 1);
      background: #fff;
      border-radius: 4px;
    }
    .hs-container.active { 
      max-height: 1400px; 
      margin-bottom: 40px;
      border: 1px solid var(--rule);
    }
    
    .hs-inner { padding: 30px 20px; }

    .hs-row { 
      display: grid; 
      grid-template-columns: 40px 1fr auto; 
      align-items: center; 
      padding: 16px 0; 
      border-bottom: 1px solid var(--cream); 
      opacity: 0; 
      transform: translateY(20px); 
      transition: all 0.5s ease; 
    }
    .hs-row.in { opacity: 1; transform: translateY(0); }
    .hs-rank { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--rule); }
    .hs-row:nth-child(-n+4) .hs-rank { color: var(--gold); }
    .hs-name { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--ink); }
    .hs-meta { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--warm-gray); text-transform: uppercase; letter-spacing: 1px; }
    .hs-score { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--rust); }
  </style>
</head>
<body>

<div id="app"></div>

<script>
const MATCH_DATA = {
  players: ["Lord", "Kratos", "Soul", "Vortex"],
  games: [
    [89,  106, 67,  95], 
    [98,  68,  115, 88], 
    [85,  135, 93,  77], 
    [121, 90,  98,  88], 
    [117, 111, 103, 111], 
    [122, 102, 92,  74],
    [94, 104, 133, 125],
    [108, 102, 96, 101],
    [128, 126, 127, 121],
    [106, 81, 99, 120],
    [92, 110, 124, 91]
  ],
  teams: {
    challenger: { name: "Skull Esports", score: 3 },
    winner: { name: "Chauhan Brothers", score: 5 }
  },
  // Mapping indices: Lord (0), Kratos (1), Soul (2), Vortex (3)
  duos: [
    { name: "Soul & Kratos", indices: [2, 1] },
    { name: "Lord & Vortex", indices: [0, 3] }
  ]
};

const processStats = () => {
  const { players, games, duos } = MATCH_DATA;
  const playerStreaks = players.map(() => ({ currentWin: 0, maxWin: 0, currentLose: 0, maxLose: 0 }));
  const allScores = [];

  const stats = players.map((name, pIdx) => {
    const scores = games.map((g, gIdx) => {
      allScores.push({ name, score: g[pIdx], game: gIdx + 1 });
      return g[pIdx];
    });
    const totalPoints = scores.reduce((a, b) => a + b, 0);
    const avg = (totalPoints / games.length).toFixed(1);
    
    let wins = 0;
    games.forEach((g, gIdx) => {
      const maxScore = Math.max(...g);
      if (g[pIdx] === maxScore) {
        wins++;
        playerStreaks[pIdx].currentWin++;
        playerStreaks[pIdx].maxWin = Math.max(playerStreaks[pIdx].maxWin, playerStreaks[pIdx].currentWin);
        playerStreaks[pIdx].currentLose = 0;
      } else {
        playerStreaks[pIdx].currentLose++;
        playerStreaks[pIdx].maxLose = Math.max(playerStreaks[pIdx].maxLose, playerStreaks[pIdx].currentLose);
        playerStreaks[pIdx].currentWin = 0;
      }
    });
    return { name, totalPoints, avg, wins, scores, maxWin: playerStreaks[pIdx].maxWin, maxLose: playerStreaks[pIdx].maxLose };
  });

  // DUO LOGIC
  const duoPerformances = [];
  games.forEach((g, gIdx) => {
    duos.forEach(duo => {
      const duoSum = g[duo.indices[0]] + g[duo.indices[1]];
      duoPerformances.push({ 
        names: duo.name, 
        score: duoSum, 
        game: gIdx + 1,
        breakdown: `${g[duo.indices[0]]} + ${g[duo.indices[1]]}`
      });
    });
  });
  const sortedDuos = [...duoPerformances].sort((a, b) => b.score - a.score).slice(0, 5);

  const ranked = [...stats].sort((a, b) => b.totalPoints - a.totalPoints);
  const highScores = allScores.sort((a, b) => b.score - a.score).slice(0, 10);
  const maxTotal = ranked[0].totalPoints;

  let highGameVal = -1, highGamePlayer = "";
  games.forEach(g => g.forEach((s, pi) => { if(s > highGameVal) { highGameVal = s; highGamePlayer = players[pi]; }}));

  let lowGameVal = 999, lowGamePlayer = "";
  games.forEach(g => g.forEach((s, pi) => { if(s < lowGameVal) { lowGameVal = s; lowGamePlayer = players[pi]; }}));

  const gameTotals = games.map(g => g.reduce((a, b) => a + b, 0));
  const bestTeamTotal = Math.max(...gameTotals);
  const bestTeamIndex = gameTotals.indexOf(bestTeamTotal) + 1;

  return { 
    ranked, maxTotal, highScores, sortedDuos,
    highGameVal, highGamePlayer, lowGameVal, lowGamePlayer, 
    bestTeamTotal, bestTeamIndex,
    bestStreakPlayer: stats.reduce((a, b) => a.maxWin > b.maxWin ? a : b),
    worstStreakPlayer: stats.reduce((a, b) => a.maxLose > b.maxLose ? a : b)
  };
};

const renderApp = () => {
  const { 
    ranked, maxTotal, highScores, sortedDuos,
    highGameVal, highGamePlayer, lowGameVal, lowGamePlayer, 
    bestTeamTotal, bestTeamIndex, bestStreakPlayer, worstStreakPlayer
  } = processStats();
  
  const totalPointsAll = MATCH_DATA.games.flat().reduce((a, b) => a + b, 0);

  const html = `
    <div class="masthead">
      <div class="masthead-inner">
        <div class="masthead-eyebrow">🎳 Official Match Record</div>
        <h1><span class="line1">Bowl</span><span class="line2">Stats</span></h1>
        <div class="masthead-meta">
          <div class="meta-item"><span class="val" data-count="${MATCH_DATA.games.length}">${MATCH_DATA.games.length}</span><span class="lbl">Games</span></div>
          <div class="meta-divider"></div>
          <div class="meta-item"><span class="val" data-count="${MATCH_DATA.players.length}">${MATCH_DATA.players.length}</span><span class="lbl">Players</span></div>
          <div class="meta-divider"></div>
          <div class="meta-item"><span class="val" data-count="${totalPointsAll}">${totalPointsAll}</span><span class="lbl">Total Points</span></div>
        </div>
      </div>
      <div class="masthead-bg-text">🎳</div>
    </div>

    <div class="h2h">
      <section>
        <div class="section-label reveal">Team Result</div>
        <div class="section-title reveal">Head-to-Head</div>
        <div class="vs-grid">
          <div class="team-block reveal">
            <span class="t-name">${MATCH_DATA.teams.challenger.name}</span>
            <div class="t-score" data-count="${MATCH_DATA.teams.challenger.score}">${MATCH_DATA.teams.challenger.score}</div>
            <span class="t-tag">Challenger</span>
          </div>
          <div class="vs-sep reveal"><span class="vs-badge">VS</span></div>
          <div class="team-block winner reveal">
            <span class="t-name">${MATCH_DATA.teams.winner.name}</span>
            <div class="t-score" data-count="${MATCH_DATA.teams.winner.score}">${MATCH_DATA.teams.winner.score}</div>
            <span class="t-tag">Winner</span>
          </div>
        </div>
      </section>
    </div>

    <section>
      <div class="section-label reveal">Rankings</div>
      <div class="section-title">Leaderboard</div>
      <div class="lb-stack stagger">
        ${ranked.map((p, i) => `
          <div class="lb-row ${i === 0 ? 'top' : ''}">
            <div class="lb-rank">${i + 1}</div>
            <div class="lb-info">
              <div class="lb-name">${p.name}</div>
              <div class="lb-sub"><span>${p.wins} ${p.wins === 1 ? 'WIN' : 'WINS'}</span><span>AVG ${p.avg}</span></div>
              <div class="wins-pip-row">
                ${Array.from({length: 10}).map((_, pi) => `<div class="pip ${pi < p.wins ? 'filled' : ''}"></div>`).join('')}
              </div>
            </div>
            <div class="lb-right">
              <div class="lb-total" data-count="${p.totalPoints}">${p.totalPoints}</div>
              <div class="lb-avg">pts total</div>
            </div>
            <div class="lb-bar-wrap">
              <div class="lb-bar" style="--target-w:${(p.totalPoints / maxTotal * 100).toFixed(1)}%" data-bar="${(p.totalPoints / maxTotal * 100).toFixed(1)}"></div>
            </div>
          </div>
        `).join('')}
      </div>
    </section>

    <hr class="rule" />

    <section>
      <div class="section-label reveal">Full Results</div>
      <div class="section-title">Match Games</div>
      <div class="games-grid">
        ${MATCH_DATA.games.map((g, gi) => {
          const gameMax = Math.max(...g);
          const combined = g.reduce((a, b) => a + b, 0);
          const gameSorted = MATCH_DATA.players.map((name, pi) => ({ name, score: g[pi] })).sort((a,b) => b.score - a.score);
          return `
            <div class="game-card scale-in">
              <div class="game-header">
                <span class="game-num">Game ${String(gi + 1).padStart(2, '0')}</span>
                <span class="game-total">Combined · ${combined} ${combined === bestTeamTotal ? '★' : ''}</span>
              </div>
              <div class="game-rows">
                ${gameSorted.map((row, ri) => `
                  <div class="game-row ${row.score === gameMax ? 'win' : ''}">
                    <div class="gr-fill" style="--fill-w:${(row.score / gameMax * 100).toFixed(1)}%"></div>
                    <div class="gr-left">
                      <span class="gr-pos">${row.score === gameMax ? 'W' : ri + 1}</span>
                      <span class="gr-name">${row.name}</span>
                    </div>
                    <span class="gr-score">${row.score}</span>
                  </div>
                `).join('')}
              </div>
            </div>`;
        }).join('')}
      </div>
    </section>

    <hr class="rule" />

    <section>
      <div class="section-label reveal">Peak Synergy</div>
      <div class="section-title">Top Duo Scores</div>
      <div class="lb-stack stagger">
        ${sortedDuos.map((duo, i) => `
          <div class="lb-row ${i === 0 ? 'top' : ''}">
            <div class="lb-rank">#${i + 1}</div>
            <div class="lb-info">
              <div class="lb-name">${duo.names}</div>
              <div class="lb-sub"><span>GAME ${duo.game}</span><span>SPLIT: ${duo.breakdown}</span></div>
            </div>
            <div class="lb-right">
              <div class="lb-total">${duo.score}</div>
              <div class="lb-avg">combined</div>
            </div>
          </div>
        `).join('')}
      </div>
    </section>

    <hr class="rule" />

    <section>
      <div class="hs-btn-wrap reveal">
        <button id="hs-trigger" class="btn-premium" onclick="toggleHighScores()">View Top Performances</button>
      </div>
      <div id="hs-list" class="hs-container">
        <div class="hs-inner">
          <div class="section-label">All-Time Peak</div>
          <div class="section-title">Top 10 Scores</div>
          <div class="hs-stack">
            ${highScores.map((hs, i) => `
              <div class="hs-row">
                <div class="hs-rank">#${i + 1}</div>
                <div class="hs-info">
                  <div class="hs-name">${hs.name}</div>
                  <div class="hs-meta">Match Game ${String(hs.game).padStart(2, '0')}</div>
                </div>
                <div class="hs-score">${hs.score}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="section-label reveal">Distinctions</div>
      <div class="section-title">Match Highlights</div>
      <div class="highlights-grid stagger">
        <div class="hl-card gold"><div class="hl-icon">🏆</div><div class="hl-label">MVP</div><div class="hl-value">${ranked[0].name}<em>${ranked[0].wins}W</em></div></div>
        <div class="hl-card sage"><div class="hl-icon">⚡</div><div class="hl-label">Best Team</div><div class="hl-value">Game ${bestTeamIndex}<em>${bestTeamTotal}</em></div></div>
        <div class="hl-card rust"><div class="hl-icon">🔥</div><div class="hl-label">High Game</div><div class="hl-value">${highGamePlayer}<em>${highGameVal}</em></div></div>
        <div class="hl-card"><div class="hl-icon">🌑</div><div class="hl-label">Low Game</div><div class="hl-value">${lowGamePlayer}<em>${lowGameVal}</em></div></div>
        <div class="hl-card"><div class="hl-icon">📈</div><div class="hl-label">Win Streak</div><div class="hl-value">${bestStreakPlayer.name}<em>${bestStreakPlayer.maxWin} Games</em></div></div>
        <div class="hl-card"><div class="hl-icon">📉</div><div class="hl-label">Lose Streak</div><div class="hl-value">${worstStreakPlayer.name}<em>${worstStreakPlayer.maxLose} Games</em></div></div>
      </div>
    </section>

    <footer>
      <div class="f-logo">🎳 BowlStats</div>
      <p>Official Match Record · All Rights Reserved</p>
    </footer>
  `;
  document.getElementById('app').innerHTML = html;
};

// ... [KEEP initAnimations, animateCount, and toggleHighScores EXACTLY AS THEY WERE] ...
const initAnimations = () => {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      el.classList.add('in');
      if (el.classList.contains('lb-row') || el.classList.contains('lb-stack') || el.classList.contains('stagger')) {
        el.querySelectorAll('.lb-bar').forEach(b => setTimeout(() => b.classList.add('animate'), 300));
        el.querySelectorAll('[data-count]').forEach((c, i) => setTimeout(() => animateCount(c), 300 + i * 80));
        el.querySelectorAll('.hl-card').forEach((card, i) => setTimeout(() => card.classList.add('in'), i * 80));
      }
      if (el.classList.contains('team-block')) {
        const score = el.querySelector('.t-score');
        if (score) setTimeout(() => score.classList.add('slam'), 150);
      }
      if (el.classList.contains('masthead-meta')) {
        el.querySelectorAll('[data-count]').forEach((c, i) => setTimeout(() => animateCount(c), 700 + i * 150));
      }
      io.unobserve(el);
    });
  }, { threshold: 0.15 });

  document.querySelectorAll('.reveal, .stagger, .scale-in, .section-title, hr.rule, .team-block, footer, .game-card, .lb-row, .masthead-meta')
    .forEach(el => io.observe(el));
};

function animateCount(el) {
  const target = parseInt(el.dataset.count, 10);
  if (isNaN(target)) return;
  const duration = target > 100 ? 1000 : 600;
  const start = performance.now();
  function tick(now) {
    const t = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(ease * target);
    if (t < 1) requestAnimationFrame(tick);
    else el.textContent = target;
  }
  requestAnimationFrame(tick);
}

window.toggleHighScores = () => {
  const list = document.getElementById('hs-list');
  const btn = document.getElementById('hs-trigger');
  const isActive = list.classList.toggle('active');
  btn.classList.toggle('active');

  if (isActive) {
    const rows = list.querySelectorAll('.hs-row');
    rows.forEach((row, i) => setTimeout(() => row.classList.add('in'), 150 + (i * 60)));
    setTimeout(() => {
        const offset = window.innerWidth < 600 ? 50 : 100;
        const top = list.getBoundingClientRect().top + window.pageYOffset - offset;
        window.scrollTo({ top, behavior: 'smooth' });
    }, 400);
  } else {
    list.querySelectorAll('.hs-row').forEach(row => row.classList.remove('in'));
  }
};

window.addEventListener('DOMContentLoaded', () => { renderApp(); initAnimations(); });
</script>
