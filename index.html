<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bowling Match Stats</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink:      #0a0a08;
      --paper:    #f5f0e8;
      --cream:    #ede7d4;
      --gold:     #b8933f;
      --gold-lt:  #d4aa5a;
      --rust:     #8b3a2a;
      --warm-gray:#8a8278;
      --rule:     #c8bfa8;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Mono', monospace;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
      opacity: 0.4;
    }

    /* Animations */
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s cubic-bezier(0.22,1,0.36,1), transform 0.7s cubic-bezier(0.22,1,0.36,1); }
    .reveal.in { opacity: 1; transform: translateY(0); }
    .stagger > * { opacity: 0; transform: translateY(16px); transition: opacity 0.55s cubic-bezier(0.22,1,0.36,1), transform 0.55s cubic-bezier(0.22,1,0.36,1); }
    .stagger.in > * { opacity: 1; transform: translateY(0); }
    .scale-in { opacity: 0; transform: scale(0.96) translateY(12px); transition: opacity 0.5s cubic-bezier(0.22,1,0.36,1), transform 0.5s cubic-bezier(0.22,1,0.36,1); }
    .scale-in.in { opacity: 1; transform: scale(1) translateY(0); }

    .masthead-eyebrow { opacity: 0; transform: translateY(-10px); animation: fadeSlideDown 0.6s cubic-bezier(0.22,1,0.36,1) 0.1s forwards; }
    .masthead h1 { overflow: hidden; }
    .masthead h1 .line1, .masthead h1 .line2 { display: block; opacity: 0; transform: translateY(110%); }
    .masthead h1 .line1 { animation: slideUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.25s forwards; }
    .masthead h1 .line2 { animation: slideUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.38s forwards; color: var(--gold); }
    .masthead-sub { opacity: 0; animation: fadeIn 0.6s ease 0.6s forwards; }
    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes fadeSlideDown { to { opacity: 1; transform: translateY(0); } }
    .masthead-bg-text { animation: floatBg 8s ease-in-out infinite; }
    @keyframes floatBg { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-16px) rotate(2deg); } }

    .t-score { opacity: 0; transform: scale(0.5); transition: opacity 0.5s cubic-bezier(0.22,1,0.36,1), transform 0.5s cubic-bezier(0.34,1.56,0.64,1); }
    .t-score.slam { opacity: 1; transform: scale(1); }
    .team-block.winner .t-tag { animation: pulseBadge 2.5s ease-in-out infinite 1.2s; }
    @keyframes pulseBadge { 0%,100% { box-shadow: 0 0 0 0 rgba(184,147,63,0.5); } 50% { box-shadow: 0 0 0 8px rgba(184,147,63,0); } }

    .lb-bar { width: 0 !important; transition: width 1.1s cubic-bezier(0.22,1,0.36,1); }
    .lb-bar.animate { width: var(--target-w) !important; }

    .game-card { transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), box-shadow 0.3s ease; }
    .game-card:hover { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(10,10,8,0.1); }
    .game-rows .game-row { opacity: 0; transform: translateX(-10px); transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.22,1,0.36,1); }
    .game-card.in .game-rows .game-row { opacity: 1; transform: none; }
    .gr-fill { width: 0 !important; transition: width 0.8s cubic-bezier(0.22,1,0.36,1); }
    .game-card.in .gr-fill { width: var(--fill-w) !important; }

    .lb-row { transition: background 0.2s ease; border-radius: 2px; }
    .lb-row:hover { background: var(--cream); }
    .lb-row.top .lb-total {
      background: linear-gradient(90deg, var(--rust) 0%, var(--gold) 40%, var(--rust) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3.5s linear infinite 1.5s;
    }
    @keyframes shimmer { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }

    .hl-card::before { width: 0; transition: width 0.7s cubic-bezier(0.22,1,0.36,1); }
    .hl-card.in::before { width: 100%; }

    #season-content { transition: opacity 0.3s ease; }
    #season-content.switching { opacity: 0; }

    /* Masthead */
    .masthead { background: var(--ink); color: var(--paper); padding: 0 20px; position: relative; overflow: hidden; }
    .masthead-inner { max-width: 480px; margin: 0 auto; padding: 44px 0 30px; }
    .masthead-eyebrow { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .masthead-eyebrow::before, .masthead-eyebrow::after { content: ''; flex: 1; height: 1px; background: var(--gold); opacity: 0.3; }
    .masthead h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(68px, 18vw, 110px); line-height: 0.88; letter-spacing: -1px; }
    .masthead-sub { margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(245,240,232,0.1); font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--warm-gray); }
    .masthead-sub strong { color: var(--gold-lt); font-weight: 400; }
    .masthead-bg-text { position: absolute; bottom: -20px; right: -10px; font-family: 'Bebas Neue', sans-serif; font-size: 150px; color: rgba(184,147,63,0.05); line-height: 1; pointer-events: none; letter-spacing: -4px; }

    /* Season Tabs */
    .season-switcher-wrap { background: var(--ink); border-top: 1px solid rgba(245,240,232,0.07); padding: 0 20px 16px; }
    .season-switcher { max-width: 480px; margin: 0 auto; display: flex; gap: 6px; }
    .season-tab { flex: 1; font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; padding: 10px 8px; border: 1px solid rgba(245,240,232,0.12); background: transparent; color: var(--warm-gray); cursor: pointer; border-radius: 2px; transition: all 0.3s cubic-bezier(0.22,1,0.36,1); position: relative; overflow: hidden; }
    .season-tab::after { content: ''; position: absolute; inset: 0; background: var(--gold); opacity: 0; transition: opacity 0.3s ease; z-index: 0; }
    .season-tab span { position: relative; z-index: 1; }
    .season-tab.active { border-color: var(--gold); color: var(--ink); font-weight: 500; }
    .season-tab.active::after { opacity: 1; }
    .season-tab:not(.active):hover { border-color: rgba(245,240,232,0.3); color: var(--paper); }
    .season-badge { display: inline-block; font-size: 6px; letter-spacing: 1px; padding: 2px 4px; border-radius: 8px; background: rgba(184,147,63,0.2); color: var(--gold-lt); margin-left: 4px; vertical-align: middle; position: relative; z-index: 1; }
    .season-tab.active .season-badge { background: rgba(10,10,8,0.15); color: var(--ink); }

    /* Sections */
    section { max-width: 480px; margin: 0 auto; padding: 36px 20px; }
    .section-label { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: var(--warm-gray); margin-bottom: 5px; }
    .section-title { font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--ink); margin-bottom: 22px; display: flex; align-items: center; gap: 12px; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--rule); }

    /* H2H */
    .h2h { background: var(--ink); }
    .h2h section { padding: 32px 20px; }
    .h2h .section-label { color: rgba(184,147,63,0.6); }
    .h2h .section-title { color: var(--paper); }
    .h2h .section-title::after { background: rgba(245,240,232,0.1); }
    .vs-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
    .team-block { text-align: center; padding: 16px 8px; }
    .team-block .t-name { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: var(--warm-gray); margin-bottom: 8px; display: block; }
    .team-block .t-score { font-family: 'Bebas Neue', sans-serif; font-size: clamp(72px, 20vw, 110px); line-height: 1; color: var(--paper); }
    .team-block.winner .t-score { color: var(--gold-lt); }
    .team-block .t-tag { display: inline-block; margin-top: 6px; font-size: 7px; letter-spacing: 2px; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; background: rgba(245,240,232,0.06); color: var(--warm-gray); }
    .team-block.winner .t-tag { background: var(--gold); color: var(--ink); }
    .vs-sep { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .vs-sep::before, .vs-sep::after { content: ''; width: 1px; height: 36px; background: rgba(245,240,232,0.08); }
    .vs-badge { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--warm-gray); letter-spacing: 2px; }

    /* Leaderboard */
    .lb-mode-toggle { display: flex; margin-bottom: 20px; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; }
    .mode-btn { flex: 1; font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 2px; text-transform: uppercase; padding: 9px 8px; background: transparent; color: var(--warm-gray); border: none; cursor: pointer; transition: all 0.25s ease; }
    .mode-btn.active { background: var(--ink); color: var(--gold); }
    .mode-btn:not(.active):hover { background: var(--cream); }

    .lb-stack { display: flex; flex-direction: column; }
    .lb-row { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 0 14px; padding: 14px 0; border-bottom: 1px solid var(--rule); position: relative; }
    .lb-row:last-child { border-bottom: none; }
    .lb-rank { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--rule); text-align: center; line-height: 1; }
    .lb-row.top .lb-rank { color: var(--gold); }
    .lb-name { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--ink); line-height: 1; }
    .lb-row.top .lb-name { color: var(--rust); }
    .lb-sub { font-size: 9px; color: var(--warm-gray); margin-top: 3px; letter-spacing: 1px; }
    .lb-sub span { margin-right: 10px; }
    .lb-right { text-align: right; }
    .lb-total { font-family: 'Bebas Neue', sans-serif; font-size: 32px; line-height: 1; color: var(--ink); }
    .lb-avg { font-size: 9px; color: var(--warm-gray); letter-spacing: 1px; }
    .lb-bar-wrap { grid-column: 2 / 4; margin-top: 6px; height: 1px; background: var(--cream); overflow: hidden; }
    .lb-bar { height: 100%; background: var(--rule); }
    .lb-row.top .lb-bar { background: var(--gold); }

    /* Highlights */
    .highlights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hl-card { border: 1px solid var(--rule); padding: 20px 16px; border-radius: 3px; background: white; position: relative; overflow: hidden; transition: transform 0.3s cubic-bezier(0.22,1,0.36,1); }
    .hl-card:hover { transform: translateY(-3px); }
    .hl-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .hl-card.gold::before { background: var(--gold); }
    .hl-card.rust::before { background: var(--rust); }
    .hl-icon { font-size: 18px; margin-bottom: 10px; }
    .hl-label { font-size: 7px; letter-spacing: 3px; text-transform: uppercase; color: var(--warm-gray); margin-bottom: 6px; }
    .hl-value { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--ink); line-height: 1.2; }
    .hl-value em { font-style: normal; font-family: 'Bebas Neue', sans-serif; font-size: 28px; display: block; color: var(--rust); }

    /* Toggle buttons */
    .toggle-btn-wrap { display: flex; justify-content: center; }
    .btn-toggle { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; background: transparent; color: var(--ink); border: 1px solid var(--rule); padding: 13px 32px; cursor: pointer; transition: all 0.35s cubic-bezier(0.22,1,0.36,1); display: flex; align-items: center; gap: 12px; }
    .btn-toggle::after { content: '↓'; font-size: 12px; transition: transform 0.35s cubic-bezier(0.22,1,0.36,1); }
    .btn-toggle.active { background: var(--ink); color: var(--gold); border-color: var(--ink); }
    .btn-toggle.active::after { transform: rotate(180deg); }
    .btn-toggle:hover:not(.active) { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .btn-toggle.dark { border-color: rgba(245,240,232,0.2); color: var(--paper); }
    .btn-toggle.dark:hover:not(.active) { background: rgba(245,240,232,0.08); }

    .collapsible { max-height: 0; overflow: hidden; transition: max-height 0.9s cubic-bezier(0.22,1,0.36,1); }
    .collapsible.active { max-height: 5000px; }

    /* Game Cards */
    .games-grid { display: flex; flex-direction: column; gap: 14px; padding: 24px 0 0; }
    .game-card { border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; background: white; }
    .game-header { background: var(--ink); color: var(--paper); padding: 9px 14px; display: flex; align-items: center; justify-content: space-between; }
    .game-num { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; color: var(--gold); }
    .game-total { font-size: 9px; color: var(--warm-gray); letter-spacing: 2px; }
    .game-row { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--cream); gap: 10px; position: relative; }
    .game-row:last-child { border-bottom: none; }
    .game-row.win { background: #fdf9ee; }
    .game-row .gr-fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(184,147,63,0.05); }
    .gr-left { display: flex; align-items: center; gap: 8px; position: relative; }
    .gr-pos { font-size: 8px; color: var(--warm-gray); letter-spacing: 1px; width: 14px; text-align: center; }
    .game-row.win .gr-pos { color: var(--gold); }
    .gr-name { font-family: 'DM Serif Display', serif; font-size: 16px; color: var(--ink); }
    .game-row.win .gr-name { color: var(--rust); }
    .gr-score { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--ink); position: relative; }
    .game-row.win .gr-score { color: var(--gold); }

    /* All-time */
    .alltime-wrap { background: var(--ink); }
    .alltime-wrap section { padding: 36px 20px; }
    .alltime-wrap .section-label { color: rgba(184,147,63,0.6); }
    .alltime-wrap .section-title { color: var(--paper); }
    .alltime-wrap .section-title::after { background: rgba(245,240,232,0.1); }
    .hs-row { display: grid; grid-template-columns: 36px 1fr auto; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(245,240,232,0.07); opacity: 0; transform: translateY(14px); transition: all 0.45s ease; }
    .hs-row:last-child { border-bottom: none; }
    .hs-row.in { opacity: 1; transform: translateY(0); }
    .hs-rank { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: rgba(245,240,232,0.15); }
    .hs-row:nth-child(-n+3) .hs-rank { color: var(--gold); }
    .hs-name { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--paper); }
    .hs-meta { font-size: 8px; color: var(--warm-gray); letter-spacing: 1px; text-transform: uppercase; }
    .hs-score { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold-lt); }

    /* Empty state */
    .empty-state { text-align: center; padding: 48px 20px; border: 1px dashed var(--rule); border-radius: 3px; }
    .empty-state-icon { font-size: 28px; margin-bottom: 12px; opacity: 0.3; }
    .empty-state-title { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--ink); opacity: 0.5; margin-bottom: 6px; }
    .empty-state-sub { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--warm-gray); }

    /* Footer */
    footer { background: #060605; color: var(--warm-gray); text-align: center; padding: 24px 20px; }
    footer .f-logo { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 6px; color: var(--gold); margin-bottom: 4px; }
    footer p { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; }
  </style>
</head>
<body>
<div id="app"></div>
<script>
// ── DATA ──────────────────────────────────────────────────────────────
const ALL_SEASONS = [
  {
    season: 1, label: "Season 1",
    players: ["Lord", "Kratos", "Soul", "Vortex"],
    games: [
      [89,  106, 67,  95],
      [98,  68,  115, 88],
      [85,  135, 93,  77],
      [121, 90,  98,  88],
      [117, 111, 103, 111],
      [122, 102, 92,  74],
      [94,  104, 133, 125],
      [108, 102, 96,  101],
      [128, 126, 127, 121],
      [106, 81,  99,  120],
      [92,  110, 124, 91],
      [95, 146, 91, 118],
      [78, 141, 130, 103]
    ],
    totalGames: 13,
    teams: {
      challenger: { name: "Skull Esports", players: ["Lord", "Vortex"], score: 5 },
      winner:     { name: "Chauhan Brothers", players: ["Soul", "Kratos"], score: 5 }
    },
    completed: true
  },

  {
    season: 2, label: "Season 2",
    players: ["Lord", "Kratos", "Soul", "Vortex"],
    games: [
      [136,  142, 155,  120],
      [127,  135,  150, 135]
    ],
    totalGames: 10,
    teams: {
      challenger: { name: "Skull Esports", players: ["Lord", "Vortex"], score: 2 },
      winner:     { name: "Chauhan Brothers", players: ["Soul", "Kratos"], score: 0 }
    },
    completed: false
  }
];

// MANUAL INPUT: Unofficial High Scores
const UNOFFICIAL_TOP_SCORES = [
  { name: "Kratos", score: 182 },
  { name: "Soul", score: 171 },
  { name: "Soul", score: 167 }
];

// ── STATE ─────────────────────────────────────────────────────────────
let currentSeasonIdx = ALL_SEASONS.length - 1;
let lbMode = 'season';

// ── STATS ─────────────────────────────────────────────────────────────
const processSeasonStats = (sd) => {
  if (!sd.games || !sd.games.length) return null;
  const { players, games, teams } = sd;
  const stats = players.map((name, pIdx) => {
    const scores = games.map(g => g[pIdx]);
    const total = scores.reduce((a, b) => a + b, 0);
    const avg   = (total / games.length).toFixed(1);
    let wins = 0;
    games.forEach(g => { if (g[pIdx] === Math.max(...g)) wins++; });
    return { name, total, avg, wins };
  });
  const ranked   = [...stats].sort((a, b) => b.total - a.total);
  const maxTotal = ranked[0].total;
  const mostWins = [...stats].sort((a, b) => b.wins - a.wins)[0];
  
  let highGameVal = -1, highGamePlayer = '';
  let lowGameVal  = 9999, lowGamePlayer = '';
  games.forEach(g => g.forEach((s, pi) => {
    if (s > highGameVal) { highGameVal = s; highGamePlayer = players[pi]; }
    if (s < lowGameVal)  { lowGameVal  = s; lowGamePlayer  = players[pi]; }
  }));

  // FIXED DUO LOGIC: Lord & Vortex vs Soul & Kratos
  let bestDuoScore = -1, bestDuoNames = '', bestDuoGame = 0;
  const teamAPlayers = teams.challenger.players;
  const teamBPlayers = teams.winner.players;
  
  games.forEach((g, gi) => {
    const scoreA = g[players.indexOf(teamAPlayers[0])] + g[players.indexOf(teamAPlayers[1])];
    const scoreB = g[players.indexOf(teamBPlayers[0])] + g[players.indexOf(teamBPlayers[1])];
    if (scoreA > bestDuoScore) { bestDuoScore = scoreA; bestDuoNames = teamAPlayers.join(' & '); bestDuoGame = gi + 1; }
    if (scoreB > bestDuoScore) { bestDuoScore = scoreB; bestDuoNames = teamBPlayers.join(' & '); bestDuoGame = gi + 1; }
  });

  let bestSquadScore = -1, bestSquadGame = 0;
  games.forEach((g, gi) => {
    const sum = g.reduce((a, b) => a + b, 0);
    if (sum > bestSquadScore) { bestSquadScore = sum; bestSquadGame = gi + 1; }
  });

  return { ranked, maxTotal, highGameVal, highGamePlayer, lowGameVal, lowGamePlayer, mostWins, bestDuoScore, bestDuoNames, bestDuoGame, bestSquadScore, bestSquadGame };
};

const processAllTimeStats = () => {
  const allScores = [];
  const pTotals = {}, pWins = {}, pGames = {};
  let highGameVal = -1, highGamePlayer = '';
  let lowGameVal  = 9999, lowGamePlayer = '';
  let bestDuoScore = -1, bestDuoNames = '', bestDuoGame = 0, bestDuoSeason = 1;
  let bestSquadScore = -1, bestSquadGame = 0, bestSquadSeason = 1;

  ALL_SEASONS.forEach(sd => {
    if (!sd.games || !sd.games.length) return;
    const teamAPlayers = sd.teams.challenger.players;
    const teamBPlayers = sd.teams.winner.players;

    sd.games.forEach((g, gi) => {
      const mx = Math.max(...g);
      g.forEach((s, pi) => {
        const n = sd.players[pi];
        allScores.push({ name: n, score: s, game: gi + 1, season: sd.season });
        pTotals[n] = (pTotals[n] || 0) + s;
        pGames[n]  = (pGames[n]  || 0) + 1;
        if (s === mx) pWins[n] = (pWins[n] || 0) + 1;
        if (s > highGameVal) { highGameVal = s; highGamePlayer = n; }
        if (s < lowGameVal)  { lowGameVal  = s; lowGamePlayer  = n; }
      });

      const scoreA = g[sd.players.indexOf(teamAPlayers[0])] + g[sd.players.indexOf(teamAPlayers[1])];
      const scoreB = g[sd.players.indexOf(teamBPlayers[0])] + g[sd.players.indexOf(teamBPlayers[1])];
      if (scoreA > bestDuoScore) { bestDuoScore = scoreA; bestDuoNames = teamAPlayers.join(' & '); bestDuoGame = gi + 1; bestDuoSeason = sd.season; }
      if (scoreB > bestDuoScore) { bestDuoScore = scoreB; bestDuoNames = teamBPlayers.join(' & '); bestDuoSeason = sd.season; }

      const squadSum = g.reduce((a, b) => a + b, 0);
      if (squadSum > bestSquadScore) { bestSquadScore = squadSum; bestSquadGame = gi + 1; bestSquadSeason = sd.season; }
    });
  });

  const allTimeLb = Object.keys(pTotals).map(name => ({
    name, total: pTotals[name], wins: pWins[name] || 0,
    avg: (pTotals[name] / pGames[name]).toFixed(1)
  })).sort((a, b) => b.total - a.total);

  const mostWins  = [...allTimeLb].sort((a, b) => b.wins - a.wins)[0];
  const topScores = [...allScores].sort((a, b) => b.score - a.score).slice(0, 10);
  const totalGames   = ALL_SEASONS.reduce((acc, s) => acc + (s.games ? s.games.length : 0), 0);
  const totalSeasons = ALL_SEASONS.filter(s => s.games && s.games.length).length;

  return { allTimeLb, topScores, totalGames, totalSeasons, highGameVal, highGamePlayer, lowGameVal, lowGamePlayer, mostWins, bestDuoScore, bestDuoNames, bestDuoGame, bestDuoSeason, bestSquadScore, bestSquadGame, bestSquadSeason };
};

// ── RENDER ────────────────────────────────────────────────────────────
const renderApp = () => {
  const sd     = ALL_SEASONS[currentSeasonIdx];
  const sStats = processSeasonStats(sd);
  const atStats = processAllTimeStats();

  const lbData = (lbMode === 'season' && sStats) ? sStats.ranked : atStats.allTimeLb;
  const lbMax  = lbData[0]?.total || 1;

  // VISIBILITY LOGIC: Always visible, plus Draw check
  const isDraw = sd.teams.challenger.score === sd.teams.winner.score;
  const winnerTeam = sd.teams.challenger.score > sd.teams.winner.score ? 'challenger' : (isDraw ? 'draw' : 'winner');

  document.getElementById('app').innerHTML = `
    <div class="masthead">
      <div class="masthead-inner">
        <div class="masthead-eyebrow">🎳 Match Record</div>
        <h1><span class="line1">Bowl</span><span class="line2">Stats</span></h1>
        <div class="masthead-sub">
          <strong>${atStats.totalSeasons}</strong> Season${atStats.totalSeasons !== 1 ? 's' : ''} &nbsp;·&nbsp;
          <strong>${atStats.totalGames}</strong> Games Played
        </div>
      </div>
      <div class="masthead-bg-text">🎳</div>
    </div>

    <div class="season-switcher-wrap">
      <div class="season-switcher">
        ${ALL_SEASONS.map((s, idx) => `
          <button class="season-tab ${idx === currentSeasonIdx ? 'active' : ''}" onclick="switchSeason(${idx})">
            <span>${s.label}
              <span class="season-badge">${!s.games || !s.games.length ? 'SOON' : s.completed ? 'DONE' : 'LIVE'}</span>
            </span>
          </button>`).join('')}
      </div>
    </div>

    <div id="season-content">

      ${lbMode === 'season' && sStats ? `
      <div class="h2h">
        <section>
          <div class="section-label reveal">${sd.label} · Result</div>
          <div class="section-title reveal">Head-to-Head</div>
          <div class="vs-grid">
            <div class="team-block ${winnerTeam === 'challenger' || winnerTeam === 'draw' ? 'winner' : ''} reveal">
              <span class="t-name">${sd.teams.challenger.name}</span>
              <div class="t-score" data-count="${sd.teams.challenger.score}">${sd.teams.challenger.score}</div>
              <span class="t-tag">${winnerTeam === 'draw' ? 'Draw' : winnerTeam === 'challenger' ? 'Winner' : 'Challenger'}</span>
            </div>
            <div class="vs-sep reveal"><span class="vs-badge">VS</span></div>
            <div class="team-block ${winnerTeam === 'winner' || winnerTeam === 'draw' ? 'winner' : ''} reveal">
              <span class="t-name">${sd.teams.winner.name}</span>
              <div class="t-score" data-count="${sd.teams.winner.score}">${sd.teams.winner.score}</div>
              <span class="t-tag">${winnerTeam === 'draw' ? 'Draw' : winnerTeam === 'winner' ? 'Winner' : 'Challenger'}</span>
            </div>
          </div>
        </section>
      </div>` : lbMode === 'season' && !sStats ? `
      <section>
        <div class="empty-state reveal">
          <div class="empty-state-icon">🎳</div>
          <div class="empty-state-title">${sd.label} Awaits</div>
          <div class="empty-state-sub">${sd.totalGames} games planned this season</div>
        </div>
      </section>` : ''}

      <section>
        <div class="section-label reveal">Rankings</div>
        <div class="section-title reveal">Leaderboard</div>
        <div class="lb-mode-toggle reveal">
          <button class="mode-btn ${lbMode === 'season' ? 'active' : ''}" onclick="setLbMode('season')">This Season</button>
          <button class="mode-btn ${lbMode === 'alltime' ? 'active' : ''}" onclick="setLbMode('alltime')">All Time</button>
        </div>
        <div class="lb-stack stagger">
          ${lbData.map((p, i) => `
            <div class="lb-row ${i === 0 ? 'top' : ''}">
              <div class="lb-rank">${i + 1}</div>
              <div class="lb-info">
                <div class="lb-name">${p.name}</div>
                <div class="lb-sub"><span>${p.wins}W</span><span>AVG ${p.avg}</span></div>
              </div>
              <div class="lb-right">
                <div class="lb-total" data-count="${p.total}">${p.total}</div>
                <div class="lb-avg">pts</div>
              </div>
              <div class="lb-bar-wrap">
                <div class="lb-bar" style="--target-w:${(p.total / lbMax * 100).toFixed(1)}%" data-bar></div>
              </div>
            </div>`).join('')}
        </div>
      </section>

      <section>
        <div class="section-label reveal">Distinctions</div>
        <div class="section-title reveal">${lbMode === 'alltime' ? 'All Time Highlights' : 'Season Highlights'}</div>
        <div class="highlights-grid stagger">
          <div class="hl-card gold">
            <div class="hl-icon">🏆</div>
            <div class="hl-label">MVP</div>
            <div class="hl-value">${lbMode === 'alltime' ? atStats.allTimeLb[0].name : sStats.ranked[0].name}<em>${lbMode === 'alltime' ? atStats.allTimeLb[0].total : sStats.ranked[0].total}</em></div>
          </div>
          <div class="hl-card rust">
            <div class="hl-icon">🔥</div>
            <div class="hl-label">High Game</div>
            <div class="hl-value">${lbMode === 'alltime' ? atStats.highGamePlayer : sStats.highGamePlayer}<em>${lbMode === 'alltime' ? atStats.highGameVal : sStats.highGameVal}</em></div>
          </div>
          <div class="hl-card">
            <div class="hl-icon">🎯</div>
            <div class="hl-label">Most Wins</div>
            <div class="hl-value">${lbMode === 'alltime' ? atStats.mostWins.name : sStats.mostWins.name}<em>${lbMode === 'alltime' ? atStats.mostWins.wins : sStats.mostWins.wins}W</em></div>
          </div>
          <div class="hl-card">
            <div class="hl-icon">🌑</div>
            <div class="hl-label">Least Score</div>
            <div class="hl-value">${lbMode === 'alltime' ? atStats.lowGamePlayer : sStats.lowGamePlayer}<em>${lbMode === 'alltime' ? atStats.lowGameVal : sStats.lowGameVal}</em></div>
          </div>
          <div class="hl-card">
            <div class="hl-icon">🤝</div>
            <div class="hl-label">Highest Duo</div>
            <div class="hl-value" style="font-size:15px;">${lbMode === 'alltime' ? atStats.bestDuoNames : sStats.bestDuoNames}<em>${lbMode === 'alltime' ? atStats.bestDuoScore : sStats.bestDuoScore}</em></div>
          </div>
          <div class="hl-card">
            <div class="hl-icon">⚡</div>
            <div class="hl-label">Highest Squad</div>
            <div class="hl-value">${lbMode === 'alltime' ? 'Game ' + atStats.bestSquadGame : 'Game ' + sStats.bestSquadGame}<em>${lbMode === 'alltime' ? atStats.bestSquadScore : sStats.bestSquadScore}</em></div>
          </div>
        </div>
      </section>

      ${lbMode === 'season' && sStats ? `
      <section>
        <div class="toggle-btn-wrap reveal">
          <button id="games-trigger" class="btn-toggle" onclick="toggleGames()">View All Games</button>
        </div>
        <div id="games-list" class="collapsible">
          <div class="games-grid">
            ${sd.games.map((g, gi) => {
              const gameMax = Math.max(...g);
              const combined = g.reduce((a, b) => a + b, 0);
              const sorted = sd.players.map((name, pi) => ({ name, score: g[pi] })).sort((a, b) => b.score - a.score);
              return `
                <div class="game-card scale-in">
                  <div class="game-header">
                    <span class="game-num">Game ${String(gi + 1).padStart(2, '0')}</span>
                    <span class="game-total">Total · ${combined}</span>
                  </div>
                  <div class="game-rows">
                    ${sorted.map((row, ri) => `
                      <div class="game-row ${row.score === gameMax ? 'win' : ''}">
                        <div class="gr-fill" style="--fill-w:${(row.score / gameMax * 100).toFixed(1)}%"></div>
                        <div class="gr-left">
                          <span class="gr-pos">${row.score === gameMax ? 'W' : ri + 1}</span>
                          <span class="gr-name">${row.name}</span>
                        </div>
                        <span class="gr-score">${row.score}</span>
                      </div>`).join('')}
                  </div>
                </div>`;
            }).join('')}
          </div>
        </div>
      </section>` : ''}

    </div>

    <div class="alltime-wrap">
      <section>
        <div class="section-label reveal">Universal Records</div>
        <div class="section-title reveal">Top 10 Official Scores</div>
        <div class="toggle-btn-wrap reveal">
          <button id="hs-trigger" class="btn-toggle dark" onclick="toggleHighScores()">View Top Scores</button>
        </div>
        <div id="hs-list" class="collapsible">
          <div style="padding-top: 20px;">
            ${atStats.topScores.map((hs, i) => `
              <div class="hs-row">
                <div class="hs-rank">#${i + 1}</div>
                <div>
                  <div class="hs-name">${hs.name}</div>
                  <div class="hs-meta">S${hs.season} · Game ${String(hs.game).padStart(2, '0')}</div>
                </div>
                <div class="hs-score">${hs.score}</div>
              </div>`).join('')}
          </div>
        </div>
      </section>

      <section>
        <div class="section-label reveal">External Records</div>
        <div class="section-title reveal">Top Unofficial Scores</div>
        <div class="lb-stack stagger">
          ${UNOFFICIAL_TOP_SCORES.map((hs, i) => `
            <div class="hs-row in">
              <div class="hs-rank">#${i + 1}</div>
              <div>
                <div class="hs-name" style="color: var(--paper);">${hs.name}</div>
                
              </div>
              <div class="hs-score" style="color: var(--gold-lt);">${hs.score}</div>
            </div>`).join('')}
        </div>
      </section>
    </div>

    <footer>
      <div class="f-logo">🎳 BowlStats</div>
      <p>Official Match Record</p>
    </footer>
  `;

  initAnimations();
};

// ── INTERACTIONS ──────────────────────────────────────────────────────
window.switchSeason = (idx) => {
  if (idx === currentSeasonIdx) return;
  
  // RESET LEADBOARD MODE TO SEASON
  lbMode = 'season';
  
  document.getElementById('season-content').classList.add('switching');
  setTimeout(() => {
    currentSeasonIdx = idx;
    renderApp();
    document.querySelector('.season-switcher-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 280);
};

window.setLbMode = (mode) => { lbMode = mode; renderApp(); };

window.toggleGames = () => {
  const list = document.getElementById('games-list');
  const btn  = document.getElementById('games-trigger');
  const open = list.classList.toggle('active');
  btn.classList.toggle('active');
  if (open) {
    setTimeout(() => {
      list.querySelectorAll('.scale-in').forEach((el, i) => setTimeout(() => el.classList.add('in'), i * 55));
      initAnimations();
    }, 120);
  } else {
    list.querySelectorAll('.scale-in').forEach(el => el.classList.remove('in'));
  }
};

window.toggleHighScores = () => {
  const list = document.getElementById('hs-list');
  const btn  = document.getElementById('hs-trigger');
  const open = list.classList.toggle('active');
  btn.classList.toggle('active');
  if (open) {
    list.querySelectorAll('.hs-row').forEach((r, i) => setTimeout(() => r.classList.add('in'), 120 + i * 50));
    setTimeout(() => {
      const top = list.getBoundingClientRect().top + window.pageYOffset - 60;
      window.scrollTo({ top, behavior: 'smooth' });
    }, 350);
  } else {
    list.querySelectorAll('.hs-row').forEach(r => r.classList.remove('in'));
  }
};

// ── ANIMATIONS ────────────────────────────────────────────────────────
const initAnimations = () => {
  const io = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      el.classList.add('in');
      if (el.classList.contains('stagger')) {
        el.querySelectorAll('.lb-bar').forEach(b => setTimeout(() => b.classList.add('animate'), 250));
        el.querySelectorAll('[data-count]').forEach((c, i) => setTimeout(() => animateCount(c), 280 + i * 70));
        el.querySelectorAll('.hl-card').forEach((c, i) => setTimeout(() => c.classList.add('in'), i * 90));
      }
      if (el.classList.contains('team-block')) {
        const sc = el.querySelector('.t-score');
        if (sc) setTimeout(() => sc.classList.add('slam'), 150);
      }
      io.unobserve(el);
    });
  }, { threshold: 0.12 });

  document.querySelectorAll('.reveal, .stagger, .scale-in, .section-title, .team-block, .lb-row, .game-card')
    .forEach(el => io.observe(el));
};

function animateCount(el) {
  const target = parseInt(el.dataset.count, 10);
  if (isNaN(target)) return;
  const dur = target > 100 ? 900 : 550;
  const start = performance.now();
  (function tick(now) {
    const t = Math.min((now - start) / dur, 1);
    el.textContent = Math.round((1 - Math.pow(1 - t, 3)) * target);
    if (t < 1) requestAnimationFrame(tick); else el.textContent = target;
  })(start);
}

window.addEventListener('DOMContentLoaded', renderApp);
</script>
